<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Watch Later</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="header">
      <img class="app-icon" src="icons/icon48.png" alt="" width="18" height="18" />
      <h1 class="app-title">Shift Watch Later</h1>
    </header>

    <section class="setting-section">
      <label class="toggle-row" for="invertToggle">
        <span class="toggle-label">Invert Controls</span>
        <span class="switch">
          <input id="invertToggle" type="checkbox" role="switch" />
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>

      <div class="mapping-list" aria-live="polite">
        <div class="mapping-row">
          <span class="mapping-key">Shift + Click</span>
          <span class="mapping-arrow" aria-hidden="true">→</span>
          <span id="shiftAction" class="mapping-action" data-watch-later="true">Watch Later</span>
        </div>
        <div class="mapping-row">
          <span class="mapping-key">Click</span>
          <span class="mapping-arrow" aria-hidden="true">→</span>
          <span id="normalAction" class="mapping-action">Open Video</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      <a
        class="sponsor-link"
        href="https://github.com/sponsors/uniunigoduni"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="heart-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 14.25l-.46-.42C3.4 10.12 1 7.95 1 5.25 1 3.12 2.68 1.5 4.8 1.5c1.24 0 2.43.58 3.2 1.5.77-.92 1.96-1.5 3.2-1.5C13.32 1.5 15 3.12 15 5.25c0 2.7-2.4 4.87-6.54 8.58L8 14.25z"
          />
        </svg>
        <span>Sponsor</span>
      </a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
